worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    log_format timings '$time_iso8601 method=$request_method uri=$uri status=$status '
                       'worker=$upstream_addr total=$request_time upstream=$upstream_response_time';
    access_log /dev/stdout timings;
    upstream generate_workers {
        least_conn;
        server 127.0.0.1:8000 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
    }
    server {
        listen 127.0.0.1:8002;
        client_max_body_size 25m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 14400s;
        proxy_send_timeout 300s;
        # Never repeat a POST on another instance after a failure.
        proxy_next_upstream off;
        proxy_buffering off;
        location = /generate {
            proxy_pass http://generate_workers;
            add_header X-Image-Worker $upstream_addr always;
        }
        # Durable jobs must stay on their original instance for status/result lookup.
        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
