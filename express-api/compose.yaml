services:
  api:
    build: .
    init: true
    ports: ["127.0.0.1:8002:8002"]
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      IMAGE_URL_HOSTS: ${IMAGE_URL_HOSTS:-}
      MAX_JOBS: 200
      CPU_THREADS: 4
    volumes: ["vehicle-data:/app/data"]
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4
    stop_grace_period: 15s
volumes:
  vehicle-data:
