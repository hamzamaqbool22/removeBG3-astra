services:
  vehicle-api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      CPU_THREADS: ${CPU_THREADS:-4}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-1000}
      PRELOAD_MODEL: "true"
    cpus: 4
    mem_limit: 24g
    volumes:
      - vehicle-jobs:/app/.cache/jobs
    stop_grace_period: 180s

volumes:
  vehicle-jobs:
